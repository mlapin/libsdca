[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libsdca"
# dependencies: setup.py adds the BLAS package of a PACKAGE build (the Linux wheels).
dynamic = ["version", "dependencies"]
description = "Accurate and fast classification losses for SDCA and neural networks: cross-entropy, top-k, multiclass and multilabel SVM, and distillation losses as fused PyTorch and JAX layers and SDCA solvers"
readme = "docs/PYTHON.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Max Lapin"}]
requires-python = ">=3.10"
keywords = [
  "sdca",
  "stochastic dual coordinate ascent",
  "svm",
  "support vector machine",
  "multiclass svm",
  "linear svm",
  "kernel svm",
  "top-k",
  "top-k svm",
  "hinge loss",
  "softmax",
  "cross-entropy",
  "log-softmax",
  "softmax collapse",
  "softmax cancellation",
  "numerically stable cross-entropy",
  "numerical stability",
  "knowledge distillation",
  "multilabel",
  "loss functions",
  "classification",
  "machine learning",
  "optimization",
  "scikit-learn",
  "pytorch",
  "jax",
  "cuda",
  "triton",
  "liblinear",
  "libsvm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
# Older supported PyTorch extension tools import pkg_resources, removed in setuptools 81.
torch = ["torch>=2.1", "setuptools>=77,<81", "ziglang>=0.13,<0.18; sys_platform == 'linux'"]
jax = ["jax>=0.4.35"]
# jax-triton 0.5 binds the keyword arrays and jax.Ref operands of triton/launch_jax.py; it needs
# Python 3.12+ and Triton 3.7+.
jax-cuda = ["jax[cuda13]>=0.7.2; sys_platform == 'linux'", "jax>=0.4.35; sys_platform != 'linux'", "triton>=3.7; sys_platform == 'linux'", "jax-triton>=0.5; sys_platform == 'linux' and python_version >= '3.12'"]
sklearn = ["scikit-learn>=1.6"]
test = ["pytest>=9", "pytest-xdist>=3.6", "scipy", "mpmath"]
test-torch = ["pytest>=9", "pytest-xdist>=3.6", "scipy", "mpmath", "hypothesis>=6.136", "torch>=2.1", "setuptools>=77,<81", "scikit-learn>=1.6"]
test-jax = ["pytest>=9", "pytest-xdist>=3.6", "scipy", "mpmath", "hypothesis>=6.136", "jax>=0.4.35", "optax>=0.2.9"]
coverage = ["coverage[toml]>=7"]

[project.urls]
Homepage = "https://mlapin.github.io/libsdca/"
"Technical Report" = "https://mlapin.github.io/libsdca/report/"
Documentation = "https://github.com/mlapin/libsdca#documentation"
Source = "https://github.com/mlapin/libsdca"
Changelog = "https://github.com/mlapin/libsdca/blob/v0.4.0/CHANGELOG.md"
Issues = "https://github.com/mlapin/libsdca/issues"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.cibuildwheel]
# One py3-none wheel per platform (see setup.py), built and tested on one Python:
# manylinux_2_28 x86_64 and macOS 11+ arm64.
build = "cp312-*"
skip = ["*-musllinux_*"]
# Tests install binary dependency wheels only (PIP_ONLY_BINARY); never compile NumPy or SciPy.
test-requires = ["pytest>=9", "scipy", "mpmath", "scikit-learn"]
test-command = "python -m pytest -p no:cacheprovider {project}/tests/python --group core --installed"

[tool.cibuildwheel.linux]
# The OpenBLAS of the package scipy-openblas32 (src/native_build.txt), which the wheel requires:
# the build links it from its own environment (no isolation) and auditwheel leaves it out.
environment = { SDCA_BLAS_BACKEND = "PACKAGE", PIP_ONLY_BINARY = ":all:" }
build-frontend = { name = "build", args = ["--no-isolation"] }
before-build = "python -m pip install 'setuptools>=77' scipy-openblas32"
repair-wheel-command = "auditwheel repair --exclude libscipy_openblas.so -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
# Accelerate, the system BLAS of every macOS (src/native_build.txt).
environment = { SDCA_BLAS_BACKEND = "EXTERNAL", PIP_ONLY_BINARY = ":all:" }

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests/python"]
# Test classes are named *Tests.
python_classes = ["Test*", "*Tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = ["cuda: needs a CUDA device (the GPU session)"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = [
  "python/*.py", "python/libsdca/**/*.py", "tests/python/**/*.py", "tools/*.py",
  "examples/python/*.py", "sdca_build.py", "setup.py",
]
extend-exclude = ["vendor", "build"]

[tool.coverage.report]
# Device code executes outside Python's tracer; its host wrappers remain counted.
exclude_also = ['^\s*@triton\.jit(?:\s*\(|\s*$)']

[tool.coverage.paths]
libsdca = ["python/libsdca", "*/python/libsdca"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# These entry points put the source tree on sys.path before importing it.
"setup.py" = ["E402"]
"python/build.py" = ["E402"]
# Test closures are called within the iteration that defines them.
"tests/python/test_*.py" = ["B023", "C90"]
"tests/python/release_numerics.py" = ["B023", "C90"]

[tool.basedpyright]
# Current PyTorch needs Python 3.10 to type-check.
pythonVersion = "3.10"
include = [
  "python/libsdca", "python/build.py", "tests/python", "examples/python", "tools",
  "sdca_build.py", "setup.py",
]
exclude = ["build", "**/__pycache__", "**/.*"]
extraPaths = ["python", "tests/python"]
# Triton is treated as untyped: its JIT DSL does not follow Python typing.
stubPath = "tools/typings"
# The stubs stand in for Triton where it is not installed (CPU-only setups).
reportMissingModuleSource = "none"
typeCheckingMode = "standard"
failOnWarnings = true
# Only rule-scoped "# pyright: ignore[rule]" comments suppress a diagnostic.
enableTypeIgnoreComments = false
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnnecessaryCast = "error"
reportMissingParameterType = "error"
# Triton kernels may leave parameters unannotated.
executionEnvironments = [
  { root = "python/libsdca/triton", reportMissingParameterType = "none" },
]
