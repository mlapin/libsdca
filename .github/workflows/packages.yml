name: Packages
# Builds the sdist, the wheels and the crate archive. A manual run can upload
# the sdist and wheels to TestPyPI; a v* tag uploads them to PyPI. Uploads use
# Trusted Publishing in the GitHub environments testpypi and pypi; the
# one-time setup is in CONTRIBUTING.md (Releases).
on:
  workflow_dispatch:
    inputs:
      testpypi:
        description: Upload the sdist and wheels to TestPyPI
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      # Check out repository sources to build and validate the release source distribution.
      - uses: actions/checkout@v7.0.1
      # Set up Python 3.12 for building and testing the sdist.
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      # On tag pushes, verify that the git tag v<version> matches the version in pyproject.toml.
      - if: github.ref_type == 'tag'
        name: Check that the tag is v<package version>
        env:
          TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os, sys, tomllib;
          v = 'v' + tomllib.load(open('pyproject.toml', 'rb'))['project']['version'];
          sys.exit(None if os.environ['TAG'] == v else 'tag ' + os.environ['TAG'] + ' is not ' + v)"
      # Install pinned PEP 517 build frontend and Twine metadata checker.
      - run: python -m pip install build==1.6.1 twine==7.0.0
      # Build the source distribution archive in dist/.
      - run: python -m build --sdist
      # Verify sdist metadata and long_description rendering for PyPI.
      - run: python -m twine check --strict dist/*
      # Install the sdist into an isolated venv outside the repo and run the core test suite.
      - name: Install the sdist outside the checkout and run its tests
        run: |
          python -m venv "$RUNNER_TEMP/env"
          py="$RUNNER_TEMP/env/bin/python" src="$RUNNER_TEMP/sdist"
          SDCA_BLAS_BACKEND=BUILTIN "$py" -m pip install dist/*.tar.gz pytest scipy mpmath scikit-learn
          mkdir "$src" && tar -xzf dist/*.tar.gz -C "$src" --strip-components=1
          cd "$RUNNER_TEMP" && "$py" -m pytest -p no:cacheprovider "$src/tests/python" --group core --installed
      # Verify that the C++ sources shipped inside the sdist can JIT-compile the PyTorch CPU extension.
      - name: Build the CPU extension from the sdist sources
        run: |
          py="$RUNNER_TEMP/env/bin/python" src="$RUNNER_TEMP/sdist"
          "$py" -m pip install torch ninja --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          cd "$RUNNER_TEMP" && SDCA_CPU_EXTENSION=on "$py" -m pytest -p no:cacheprovider \
            "$src/tests/python/test_cpu_extension.py" --group torch --installed
      # Save the verified sdist tarball for the TestPyPI / PyPI publish jobs.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # manylinux_2_28 x86_64 and macOS 11+ arm64; see [tool.cibuildwheel].
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      # Check out repository sources to build and test portable binary wheels.
      - uses: actions/checkout@v7.0.1
      # Build py3-none platform wheels with built-in BLAS, repair with auditwheel/delocate, and run core tests.
      - uses: pypa/cibuildwheel@v4.3.5
      # Validate wheel metadata and README formatting with Twine.
      - run: pipx run --spec twine==7.0.0 twine check --strict wheelhouse/*
      # Upload the platform wheel artifact for the TestPyPI / PyPI publish jobs.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  crate:
    name: crate
    runs-on: ubuntu-24.04
    steps:
      # Check out repository sources to package and test the standalone Rust crate archive.
      - uses: actions/checkout@v7.0.1
      # Install stable Rust toolchain to package and test the crate.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # Vendor the C++ headers and C ABI sources into rust/native/ and build the .crate archive.
      - run: rust/package.sh
      # Extract the .crate archive outside the repository and run its tests and example to verify self-containment.
      - name: Test the packaged crate outside the checkout
        run: |
          mkdir "$RUNNER_TEMP/crate"
          tar -xzf rust/target/package/libsdca-*.crate -C "$RUNNER_TEMP/crate" --strip-components=1
          cd "$RUNNER_TEMP/crate" && cargo test && cargo run --example train
      # Upload the verified .crate archive as a workflow artifact.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: crate
          path: rust/target/package/*.crate

  testpypi:
    name: Upload (TestPyPI)
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/libsdca/
    permissions:
      id-token: write
    steps:
      # Download the verified sdist and platform wheels built by earlier jobs.
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Publish sdist and wheels to TestPyPI via OIDC Trusted Publishing.
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Upload (PyPI)
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [sdist, wheels, crate]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/libsdca/
    permissions:
      id-token: write
    steps:
      # Download the verified sdist and platform wheels built by earlier jobs.
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Publish sdist and wheels to PyPI via OIDC Trusted Publishing.
      - uses: pypa/gh-action-pypi-publish@v1.14.3
