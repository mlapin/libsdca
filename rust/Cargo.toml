[package]
name = "libsdca"
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
description = "Accurate and fast classification losses for SDCA and neural networks: SDCA solvers and loss gradients for cross-entropy, top-k, multiclass and multilabel SVM, and distillation losses"
license = "MIT"
authors = ["Max Lapin"]
homepage = "https://mlapin.github.io/libsdca/"
documentation = "https://github.com/mlapin/libsdca#documentation"
repository = "https://github.com/mlapin/libsdca"
readme = "README.md"
keywords = ["sdca", "svm", "cross-entropy", "top-k", "machine-learning"]
categories = ["science", "mathematics", "algorithms", "api-bindings"]
links = "sdca"
build = "build.rs"
include = ["build.rs", "src/**", "tests/**", "examples/**", "native/**", "README.md", "LICENSE"]

[dependencies]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
